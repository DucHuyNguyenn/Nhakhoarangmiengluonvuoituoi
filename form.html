<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./asset/css/styleform.css" />
  </head>
  <body>
    <header>
      <h1>Đăng ký lịch khám</h1>
      <nav>
        <a href="./index.html">Trang chủ</a>
        <a href="./dichvu.html">Dịch vụ</a> <a href="#">Đăng ký lịch khám</a>
      </nav>
    </header>
    <section>
      <form action="nowhere">
        <section>
          <div>Họ và tên</div>
          <input type="text" name="name" id="info" placeholder="Nhập họ tên" />
        </section>
        <section>
          <div>Email</div>
          <input
            type="mail"
            name="email"
            id="email"
            placeholder="example@gmail.com"
          />
        </section>
        <section>
          <div>Số điện thoại</div>
          <input type="tel" name="phone" id="tel" />
        </section>
        <section>
          <div>Chọn dịch vụ</div>
          <select name="service">
            <option value="krtq">Khám răng tổng quát</option>
            <option value="lcr">Lấy cao răng</option>
            <option value="ttr">Tẩy trắng răng</option>
            <option value="nr">Niềng răng</option>
            <option value="trs">Trồng răng sứ</option>
          </select>
        </section>
        <section>
          <div>Ngày khám</div>
          <input type="date" name="date" id="date" />
        </section>
        <section>
          <div>Khung giờ mong muốn</div>
          <input type="time" name="time" id="time" />
        </section>
        <section>
          <div>Ghi chú thêm</div>
          <textarea name="" id="" placeholder="Yêu cầu thêm..."></textarea>
        </section>
        <section>
          <button type="submit">Đăng Ký</button>
        </section>
      </form>
    </section>
    <footer>
      <p>&copy; 2026 Nha Khoa Chăm Sóc Nụ Cười Việt</p>
      <p>Địa chỉ: 123 Đường Buồn Bã - Hotline: 1900 1509 777</p>
    </footer>
  </body>
</html>
