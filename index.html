<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Đăng ký lịch khám</h1>
    </header>
    <section>
        <nav><a>Trang chủ</a> <a>Dịch vụ</a> <a>Đăng ký lịch khám</a> </nav>
    </section>
    <section>
        <form action="nowhere">
            <section>
                <div>Họ và tên</div>
                <input type="text" name="name" id="info">
            </section>
            <section>
                <div>Email</div>
                <input type="mail" name="email" id="email">
            </section>
            <section>
                <div>Số điện thoại</div>
                <input type="tel" name="phone" id="tel">
            </section>
            <section>
                <div>Chọn dịch vụ</div>
                <select name="service">
                    <option value="krtq">Khám răng tổng quát</option>
                    <option value="lcr">Lấy cao răng</option>
                    <option value="ttr">Tẩy trắng răng</option>
                    <option value="nr">Nhổ răng</option>
                </select>
            </section>
            <section>
                <div>Ngày khám</div>
                <input type="date" name="date" id="date">
            </section>
            <section>
                <div>Ghi chú</div>
                <textarea name="" id=""></textarea>
            </section>
            <section>
                <button type="submit">Đăng Ký</button>
            </section>
        </form>
    </section>
</body>
</html>
